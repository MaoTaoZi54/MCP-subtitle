[project]
name = "nas-app"
version = "0.19.28"
description = "NAS 媒体工具箱 · 独立应用版（Web UI + HTTP API + MCP Streamable HTTP，飞牛应用商店 / Docker）"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "curl_cffi>=0.10",
    "mcp==1.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nas-app = "nas_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nas_app", "nas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
