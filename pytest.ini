[pytest]
# 根目录一条 pytest 跑三个子项目：只收集各自的 tests/，避免同名测试模块冲突。
testpaths =
    nas-app/tests
    nas-mcp/tests
    nas-octop-plugin/tests

# 三个子项目存在同名测试文件（test_multisite / test_mux_subtitles / test_v0183_fixes），
# importlib 模式按路径生成唯一模块名，不会互相覆盖。
addopts =
    --import-mode=importlib
    -m "not live"
    --ignore=nas-app/scripts/live_api_test.py

markers =
    live: 需要真实 NAS 地址或外部凭据的联调测试；默认由 -m "not live" 排除

# 子项目单跑时（尤其 nas-mcp）也能直接 import 自己的包。
pythonpath =
    .
    nas-app
    nas-mcp/src
    nas-octop-plugin

# 只收集 test_*.py；live_api_test.py 是独立脚本（导入时读取 LIVE_API_TOKEN），
# 不属于单元测试，单独运行方式见 README 或下方说明。
python_files = test_*.py
norecursedirs =
    .git
    .venv
    __pycache__
    dist
    docs
    logs
    .pytest_cache
    nas-app/scripts
