id: nas-media
name: NAS 媒体工具箱
version: 0.10.0
kind: tool
entry: main.py
description: >-
  飞牛 NAS 影视媒体智能分析与资源搜索：目录浏览/文件搜索/磁盘空间、
  ffprobe 媒体扫描（HDR/DV/音轨/字幕）、国产判定、TMDB 中文片名解析、
  Jackett 磁力链搜索（质量评分）、SubHD 字幕搜索与下载、媒体库体检/查重/质量分析。
  路径白名单 + 排除目录强制安全边界，默认只读。与独立版 nas-mcp 同源。
group: media
icon: "🎬"
requires:
  - PyYAML>=6.0
