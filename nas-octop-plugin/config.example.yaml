# NAS MCP 配置文件示例
# 部署到 NAS 时复制为 config.yaml，并按实际存储结构修改。
# 所有路径必须是绝对路径；白名单/排除/搜索范围支持 glob 模式，加盘与网盘 hash 变化无需改配置。

# ===== 路径白名单（最高优先级安全边界，必须配置，不允许为空） =====
# 条目支持 glob 模式（含 * ? [ 的按模式处理，否则按字面量前缀匹配）。
# fnOS 存储命名规则（官方论坛/社区逆向一致）：/volN（无前导零）= 本地存储空间，
# /vol00+/vol01 = USB 外接，/vol02+ = 远程挂载（网盘，挂载点形如 1000-1-<hash> 且 hash 会变）。
# 模式 /vol[1-9]*/1000 只放行本地存储空间的管理员（UID 1000）目录：
# 新盘 vol3~vol9 甚至 vol10 插上即自动纳入，无需改配置、无需重启。
allowed_paths:
  - /vol[1-9]*/1000

# ===== 默认搜索范围（必须是 allowed_paths 的子集；缺省时等于 allowed_paths） =====
# 每次工具调用时动态展开为当前实际存在的目录，加盘/卸盘即时生效。
media_roots:
  - /vol[1-9]*/1000

# ===== 排除目录（网盘/外接存储），任何工具都不得扫描/列出/搜索 =====
# /vol0*        ：前导零卷 = USB 外接（vol00/01）+ 远程挂载网盘（vol02 起）——hash 变化无关
# /vol[1-9]*/1000-*：纵深防御——本地卷下出现的挂载点形态目录（1000-N-hash）一并排除
# 最后一条保留原有字面量排除作为兜底（模式失效时仍有精确防线）
exclude_paths:
  - /vol0*
  - /vol[1-9]*/1000-*
  - /vol02/1000-1-7dc1cef4

# ===== 媒体文件扩展名（可按需增删） =====
video_extensions: [mkv, mp4, avi, mov, ts, m2ts, webm, wmv, flv]
subtitle_extensions: [srt, ass, ssa, sub, vtt, sup]

# ===== 性能限额 =====
limits:
  max_list_entries: 500      # nas_list_directory 单页最大返回条数
  max_search_results: 100    # nas_find_files 单页最大返回条数
  max_scan_files: 100000     # 单次扫描最多访问的条目数（超出则标记 scan_truncated）
  max_list_depth: 10         # 递归/搜索的最大目录深度
  max_errors_reported: 20    # 单次结果中最多报告多少条单文件错误

# ===== 媒体分析（M3：nas_scan_media / nas_check_subtitle；§18：nas_classify_region） =====
media:
  ffprobe_path: ffprobe         # NAS 上需安装 ffmpeg/ffprobe（如 /usr/bin/ffprobe）
  ffprobe_timeout_seconds: 20   # 单个文件的 ffprobe 超时（秒）
  max_probe_files: 200          # 单次 nas_scan_media 最多用 ffprobe 探测的文件数，防止长时间阻塞
  max_classify_batch: 20        # nas_classify_region 单次批量上限（音轨+TMDB 综合判产地）

  # 文件名跳过模式：命中（对去扩展名的文件名、大小写不敏感）的文件在
  # nas_scan_media / nas_find_files 中被隐藏，只在 skipped_by_filter 计数。
  # 不配置 = 使用内置默认集（IMG_/VID_/DJI_/时间戳命名 + FC2 等成人标记）；
  # 设为 [] 可关闭过滤；也可整体覆盖为自定义列表（正则，易误杀的番号通式请自行斟酌）。
  # skip_filename_patterns: []

# ===== 日志 =====
logging:
  file: logs/nas-mcp.log     # 相对于启动时的工作目录
  level: INFO

# ===== SubHD 字幕搜索/下载（subhd_search / subhd_download） =====
subhd:
  enabled: true                        # 总开关；false 时搜索/下载工具直接拒绝
  base_url: https://subhd.tv           # 官方站；测试/镜像时可改
  timeout_seconds: 15                  # 单次 HTTP 请求超时
  max_results: 20                      # 单次搜索最多返回候选条数
  max_download_bytes: 20971520         # 下载包大小上限（20MB）
  min_request_interval_seconds: 1.0    # 请求间隔限速，避免对站点造成压力
  filename_template: "{stem}.{lang}.{ext}"  # 保存命名模板，必须含 {stem}/{lang}/{ext}

# ===== 影视识别（P3：resolve_media；也被 jackett_search 内部使用） =====
# 中文片名先经 TMDB 解析为标准实体（原名+年份），再用于资源/字幕搜索。
tmdb:
  enabled: false                       # 总开关；true 时必须能取到 api_key，否则拒绝启动
  base_url: https://api.themoviedb.org/3
  language: zh-CN
  timeout_seconds: 15
  api_key_env: TMDB_API_KEY            # 方式一：从该环境变量读取（推荐）
  api_key: ""                          # 方式二：字面量，支持 ${TMDB_API_KEY} 环境变量替换语法

# ===== Jackett 资源搜索（P4：jackett_search，只搜索返回磁力链，绝不下载） =====
jackett:
  enabled: false                       # 总开关；true 时必须能取到 api_key，否则拒绝启动
  url: http://127.0.0.1:9117           # NAS 上 Jackett 的地址；也可写 ${JACKETT_URL} 由环境变量替换
  url_env: JACKETT_URL                 # 方式一（优先）：从该环境变量读取地址（推荐，与 key 一起在 Octop 连接器 env 里填）
  timeout_seconds: 20
  max_results: 100                     # 单次返回上限（≤1000）
  max_queries: 4                       # 单次搜索生成的关键词组合数上限（≤10）
  min_request_interval_seconds: 0.5    # 请求间隔限速
  api_key_env: JACKETT_API_KEY         # 方式一：从该环境变量读取（推荐）
  api_key: ""                          # 方式二：字面量，支持 ${JACKETT_API_KEY} 环境变量替换语法

# ===== 权限开关 =====
# enable_write 开启后仅放开“字幕下载落盘”（保存到视频同目录，仍受白名单约束）；
# 其余工具保持只读。删除能力未实现，enable_delete 保留占位。
enable_write: false
enable_delete: false
